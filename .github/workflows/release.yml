name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build and Package Windows Installer
        run: npm run dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WhatDayIsIt Setup *.exe
          name: ${{ github.ref_name }}
          body: |
            ## What Day is It? ${{ github.ref_name }}
            
            A lightweight, transparent desktop calendar overlay for Windows synchronized directly with Google Calendar.
            
            ### ⬇️ Download
            - **[WhatDayIsIt Setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhatDayIsIt%20Setup%201.1.0.exe)**
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
